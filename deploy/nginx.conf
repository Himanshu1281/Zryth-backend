# /etc/nginx/sites-available/aicalling.wrytflow.com
#
#   aicalling.wrytflow.com (HTTPS :443)
#     /                                  -> dashboard build   (/var/www/website)
#     /api/                              -> zryth-backend      (127.0.0.1:3000)
#     /internal/supabase/knowledge-sync  -> agent webhook      (127.0.0.1:8090)  Supabase DB webhook only
#     /internal/*  (everything else)     -> blocked; the backend reaches the agent on localhost
#
# Dashboard and API share one origin, so the browser makes no CORS requests.
# certbot --nginx -d aicalling.wrytflow.com adds the ssl_certificate lines and the :80 redirect.

server {
    server_name aicalling.wrytflow.com;
    listen 443 ssl;
    http2 on;

    client_max_body_size 55M;   # knowledge uploads (50MB limit in the backend)

    # --- Dashboard (Vite build output: npm run build -> dist/*) ---
    root /var/www/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA: /calls/123 etc. load index.html
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";   # hashed file names
    }

    location = /index.html {
        add_header Cache-Control "no-cache";            # new deploys show up immediately
    }

    # --- Backend API ---
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;    # knowledge ingest can take a while
    }

    # --- Agent webhook: only the Supabase database webhook route is public (needs X-Webhook-Secret) ---
    location = /internal/supabase/knowledge-sync {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ingest / delete / summarize are called by zryth-backend over localhost, never from outside
    location /internal/ {
        return 404;
    }

    # ssl_certificate ... managed by certbot
}

server {
    listen 80;
    server_name aicalling.wrytflow.com;
    return 301 https://$host$request_uri;
}
